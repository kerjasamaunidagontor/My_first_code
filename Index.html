<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <h1 id="judul">Hello</h1>

    <button onclick="ubahTeks()">
        Klik Saya
    </button>

    <script>
        function ubahTeks() {
            document.getElementById("judul").innerText =
                "Hello, Selamat Belajar JavaScript!";
        }
    </script>

</body>
</html>
